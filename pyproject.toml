[project]
name = "animation-factory"
version = "0.1.0"
description = "Reusable Pixar-style 3D animation factory — Python CLI + bpy pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
