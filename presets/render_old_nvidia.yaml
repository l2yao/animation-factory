# Render tier for old NVIDIA like GTX 650 Ti 1GB VRAM
render:
  engine: BLENDER_EEVEE
  resolution: [1920, 1080]  # 1080p master for 16:9
  fps: 24
  samples: 16  # EEVEE samples
  use_gtao: true
  use_bloom: true
  use_ssr: false  # disable for VRAM
  use_motion_blur: false
  film_transparent: false
  output_format: PNG
  color_depth: "8"
  # Cycles fallback disabled for 1GB VRAM
  cycles_fallback: false
  cycles_samples: 64

# Derivatives — no re-render, ffmpeg crop from master
aspects:
  "16:9": { width: 1920, height: 1080, crop: false }
  "9:16": { width: 1080, height: 1920, crop: true, crop_from: "16:9" }
  "1:1":  { width: 1080, height: 1080, crop: true, crop_from: "16:9" }

performance:
  tile_size: 256
  use_persistent_data: false
  vram_limit_mb: 1024
